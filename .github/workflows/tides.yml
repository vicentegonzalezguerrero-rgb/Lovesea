name: Generar tabla de mareas

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/harmonics/**"
      - ".github/workflows/tides.yml"

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install utide "pandas<3" numpy
      - run: python tools/harmonics/derive.py
      - uses: actions/upload-artifact@v4
        with:
          name: tides
          path: app/src/main/assets/tides/
      - name: Guardar la tabla en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/tides/
          git diff --cached --quiet || git commit -m "Actualizar tabla de mareas de Valparaíso"
          git push
